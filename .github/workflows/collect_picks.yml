name: collect_picks

on:
  schedule:
    # every 15 minutes - cheap (a single getUpdates call), polling per the
    # plan since nothing here is time-sensitive.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect_picks
  cancel-in-progress: false

jobs:
  collect_picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll Telegram for pick/reject decisions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python src/collect_picks.py

      - name: Commit updated picks log
        run: |
          git config user.name "programming-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add data/
          git diff --cached --quiet || git commit -m "chore: collect_picks run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
